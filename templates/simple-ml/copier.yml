# Simple ML Template Configuration
_subdirectory: "{{project_slug}}"
_templates_suffix: .jinja

# Template-specific questions only

# =================================
# Python Configuration
# =================================

python_version:
  type: str
  help: Python version
  choices:
    - "3.12"
    - "3.11"
    - "3.10"
  default: "3.12"

package_manager:
  type: str
  help: Package manager
  choices:
    UV (recommended): uv
    Poetry: poetry
  default: uv

# =================================
# ML Configuration
# =================================

model_type:
  type: str
  help: What type of ML model?
  choices:
    Classification: classification
    Regression: regression
    Clustering: clustering
  default: classification

dataset_source:
  type: str
  help: Where is your dataset?
  choices:
    Local files: local
    Kaggle: kaggle
    Hugging Face: huggingface
  default: local

# =================================
# Tools
# =================================

use_wandb:
  type: bool
  help: Include W&B tracking?
  default: yes

use_hydra:
  type: bool
  help: Include Hydra config?
  default: yes

use_marimo:
  type: bool
  help: Include Marimo notebooks?
  default: yes

use_docker:
  type: bool
  help: Include Docker?
  default: yes

use_precommit:
  type: bool
  help: Include pre-commit hooks?
  default: yes

# =================================
# CI/CD
# =================================

ci_cd:
  type: str
  help: CI/CD platform
  choices:
    GitHub Actions: github
    GitLab CI: gitlab
    None: none
  default: github

license:
  type: str
  help: Project license
  choices:
    MIT: MIT
    Apache 2.0: Apache-2.0
    BSD 3-Clause: BSD-3-Clause
    Proprietary: Proprietary
  default: MIT

init_git:
  type: bool
  help: Initialize git repository?
  default: yes

_tasks:
  - "{% if init_git %}git init{% endif %}"
  - "{% if init_git %}git add .{% endif %}"
  - "{% if init_git %}git commit -m 'Initial commit from Rawk simple-ml template'{% endif %}"
  - echo "✓ Project {{ project_name }} created!"
  - echo "  cd {{ project_slug }}"
  - echo "  ./setup.sh"
  - echo " Rawk your ML project! ⚡"
